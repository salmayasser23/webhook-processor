name: CI

on:
  push:
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and unit tests
        run: |
          ruff check .
          python -m compileall -q app alembic tests scripts
          python -m pytest -q
      - name: Configure local Docker environment
        run: cp .env.example .env
      - name: Start real PostgreSQL and API
        run: docker compose up -d --build
      - name: Smoke test with actual PostgreSQL
        run: python scripts/smoke_test.py
      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --no-color db migrate api || true
      - name: Stop containers
        if: always()
        run: docker compose down -v || true
