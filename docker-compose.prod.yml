services:
  caddy:
    image: caddy:2
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: